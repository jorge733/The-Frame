<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modo Cuadro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; cursor: none; background: #000; }
  body { font-family: 'Cormorant Garamond', Georgia, serif; }

  /* Marco dorado pegado a los bordes de la pantalla */
  #frame {
    position: fixed; inset: 0;
    padding: 2.2vh;
    background: linear-gradient(135deg, #f6dc8f 0%, #b8862f 18%, #7a5418 35%, #d9ae55 52%, #8a611f 70%, #f0cf7c 86%, #9c7228 100%);
    box-shadow:
      inset 0 0 0 .35vh #5e3f10,
      inset 0 0 0 .7vh #e8c46c,
      inset 0 0 0 1.1vh #7d5719,
      inset .6vh .6vh 1.2vh rgba(255,240,190,.55),
      inset -.6vh -.6vh 1.2vh rgba(40,25,5,.7);
  }
  /* Paspartú delgado */
  #mat {
    position: relative; width: 100%; height: 100%;
    padding: 1.6vh;
    background: #efe7d6;
    box-shadow: inset 0 0 1.4vh rgba(0,0,0,.4);
  }
  /* Ventana donde va la pintura: se llena entera */
  #window {
    position: relative; width: 100%; height: 100%;
    overflow: hidden; background: #111;
    box-shadow: inset 0 0 1.2vh rgba(0,0,0,.6);
  }
  .layer { position: absolute; inset: 0; transition: opacity 2.2s ease; }
  .layer .bg {
    position: absolute; inset: -6%;
    background-size: cover; background-position: center;
    filter: blur(40px) brightness(.55) saturate(1.1);
  }
  .layer .fg {
    position: absolute; inset: 0;
    background-repeat: no-repeat; background-position: center;
  }
  .fade { opacity: 0; }

  .plaque {
    position: absolute; right: 2.5vh; bottom: 2.5vh;
    padding: .9vh 2vh; text-align: right;
    background: linear-gradient(180deg, rgba(217,188,119,.95), rgba(169,133,61,.95));
    color: #2a1d08; border-radius: .4vh;
    box-shadow: 0 .6vh 1.4vh rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.5);
    transition: opacity 1s ease; max-width: 45vw;
  }
  .plaque .t { font-size: 2.3vh; font-style: italic; font-weight: 600; line-height: 1.15; }
  .plaque .a { font-size: 1.7vh; font-weight: 500; letter-spacing: .05em; }
  .hidden-plaque .plaque { opacity: 0; }

  #night { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 4s ease; }
  #help {
    position: fixed; top: 4vh; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.75); color: #eee; font-family: system-ui, sans-serif;
    font-size: 1.8vh; padding: 1.2vh 2.4vh; border-radius: 1vh;
    opacity: 0; transition: opacity .6s ease; pointer-events: none; white-space: nowrap;
  }
  #help.show { opacity: 1; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 3vh; font-style: italic; color: #e9dcc3; background: #1a1513; }
</style>
</head>
<body class="hidden-plaque">
<div id="frame"><div id="mat"><div id="window">
  <div class="layer" id="A"><div class="bg"></div><div class="fg"></div></div>
  <div class="layer fade" id="B"><div class="bg"></div><div class="fg"></div></div>
  <div class="plaque" id="plaque"><div class="t" id="title"></div><div class="a" id="artist"></div></div>
</div></div></div>
<div id="loading">Colgando la obra…</div>
<div id="night"></div>
<div id="help">◀ ▶ cambiar obra · OK placa · ▲ ▼ brillo</div>

<script>
/* ====== CONFIGURACIÓN ====== */
var MINUTOS_POR_OBRA = 10;       // cada cuánto cambia la pintura
var HORA_NOCHE_INICIO = 23;      // desde esta hora se atenúa
var HORA_NOCHE_FIN = 7;          // hasta esta hora
var ATENUACION_NOCHE = 0.55;     // 0 = nada, 1 = negro total
var ALEATORIO = true;            // orden al azar
var SEGUNDOS_PLACA = 8;          // la placa aparece unos segundos al cambiar de obra (0 = nunca)
// Si la forma de la pintura se parece a la de la pantalla, se recorta para llenarla entera.
// Si es muy distinta (por ejemplo, un retrato vertical), se muestra completa sobre un fondo
// difuminado de la misma pintura, así igual se cubre toda la pantalla sin franjas negras.
var TOLERANCIA_RECORTE = 0.35;

/* Pinturas clásicas de dominio público, servidas desde Wikimedia Commons */
var OBRAS = [
  ["Tsunami_by_hokusai_19th_century.jpg", "La gran ola de Kanagawa", "Katsushika Hokusai, c. 1831"],
  ["Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg", "La noche estrellada", "Vincent van Gogh, 1889"],
  ["Mona_Lisa,_by_Leonardo_da_Vinci,_from_C2RMF_retouched.jpg", "La Gioconda", "Leonardo da Vinci, c. 1503"],
  ["1665_Girl_with_a_Pearl_Earring.jpg", "La joven de la perla", "Johannes Vermeer, c. 1665"],
  ["Claude_Monet,_Impression,_soleil_levant.jpg", "Impresión, sol naciente", "Claude Monet, 1872"],
  ["Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg", "El nacimiento de Venus", "Sandro Botticelli, c. 1485"],
  ["Caspar_David_Friedrich_-_Wanderer_above_the_sea_of_fog.jpg", "El caminante sobre el mar de nubes", "Caspar David Friedrich, 1818"],
  ["The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg", "El beso", "Gustav Klimt, 1908"],
  ["Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.jpg", "La lechera", "Johannes Vermeer, c. 1658"],
  ["The_Night_Watch_-_HD.jpg", "La ronda de noche", "Rembrandt, 1642"],
  ["Pieter_Bruegel_the_Elder_-_Hunters_in_the_Snow_(Winter)_-_Google_Art_Project.jpg", "Cazadores en la nieve", "Pieter Bruegel el Viejo, 1565"],
  ["Georges_Seurat_-_A_Sunday_on_La_Grande_Jatte_--_1884_-_Google_Art_Project.jpg", "Tarde de domingo en la isla de La Grande Jatte", "Georges Seurat, 1884"],
  ["Claude_Monet_-_Woman_with_a_Parasol_-_Madame_Monet_and_Her_Son_-_Google_Art_Project.jpg", "Mujer con sombrilla", "Claude Monet, 1875"],
  ["Claude_Monet_-_Water_Lilies_-_1906,_Ryerson.jpg", "Nenúfares", "Claude Monet, 1906"],
  ["Edvard_Munch,_1893,_The_Scream,_oil,_tempera_and_pastel_on_cardboard,_91_x_73_cm,_National_Gallery_of_Norway.jpg", "El grito", "Edvard Munch, 1893"],
  ["Vincent_Willem_van_Gogh_127.jpg", "Los girasoles", "Vincent van Gogh, 1888"],
  ["Jan_van_Eyck_-_The_Arnolfini_Portrait_-_Google_Art_Project.jpg", "El matrimonio Arnolfini", "Jan van Eyck, 1434"],
  ["John_William_Waterhouse_-_The_Lady_of_Shalott_-_Google_Art_Project_edit.jpg", "La dama de Shalott", "John William Waterhouse, 1888"]
];

/* ====== LÓGICA ====== */
var win = document.getElementById('window');
var capas = [document.getElementById('A'), document.getElementById('B')];
var activa = 0, primera = true;
var night = document.getElementById('night');
var help = document.getElementById('help');
var orden = [], pos = -1, timer = null, brilloManual = 0, fallos = 0, placaTimer;

function url(f) {
  return 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(f) + '?width=2400';
}
function barajar() {
  orden = OBRAS.map(function (_, i) { return i; });
  if (ALEATORIO) for (var i = orden.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)); var t = orden[i]; orden[i] = orden[j]; orden[j] = t;
  }
}
function pintarCapa(capa, src, w, h) {
  var bg = capa.querySelector('.bg'), fg = capa.querySelector('.fg');
  var css = 'url("' + src + '")';
  bg.style.backgroundImage = css;
  fg.style.backgroundImage = css;
  var rImg = w / h, rWin = win.clientWidth / win.clientHeight;
  var dif = Math.abs(Math.log(rImg / rWin));
  var cubrir = dif <= TOLERANCIA_RECORTE;
  fg.style.backgroundSize = cubrir ? 'cover' : 'contain';
  bg.style.display = cubrir ? 'none' : 'block';
  // en retratos recortados, privilegia la parte superior (las caras)
  fg.style.backgroundPosition = rImg < rWin ? 'center 30%' : 'center';
  fg.style.boxShadow = cubrir ? 'none' : '0 0 3vh rgba(0,0,0,.6)';
}
function mostrar(dir) {
  if (!orden.length) barajar();
  pos = (pos + dir + orden.length) % orden.length;
  var obra = OBRAS[orden[pos]];
  var pre = new Image();
  pre.onload = function () {
    fallos = 0;
    var siguiente = primera ? activa : 1 - activa;
    pintarCapa(capas[siguiente], pre.src, pre.naturalWidth, pre.naturalHeight);
    capas[siguiente].dataset.w = pre.naturalWidth; capas[siguiente].dataset.h = pre.naturalHeight;
    capas[siguiente].dataset.src = pre.src;
    capas[siguiente].classList.remove('fade');
    if (!primera) capas[activa].classList.add('fade');
    activa = siguiente; primera = false;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('title').textContent = obra[1];
    document.getElementById('artist').textContent = obra[2];
    if (SEGUNDOS_PLACA > 0) mostrarPlaca(SEGUNDOS_PLACA);
  };
  pre.onerror = function () {          // si una imagen no carga, pasa a la siguiente
    if (++fallos < OBRAS.length) mostrar(dir || 1);
    else document.getElementById('loading').textContent = 'No se pudieron cargar las obras. Revisa la conexión.';
  };
  pre.src = url(obra[0]);
  reiniciarTimer();
}
var placaFija = false;
function mostrarPlaca(seg) {
  document.body.classList.remove('hidden-plaque');
  clearTimeout(placaTimer);
  if (!placaFija) placaTimer = setTimeout(function () { document.body.classList.add('hidden-plaque'); }, seg * 1000);
}
function reiniciarTimer() {
  clearInterval(timer);
  timer = setInterval(function () { mostrar(1); }, MINUTOS_POR_OBRA * 60000);
}
function aplicarBrillo() {
  var h = new Date().getHours();
  var esNoche = HORA_NOCHE_INICIO > HORA_NOCHE_FIN
    ? (h >= HORA_NOCHE_INICIO || h < HORA_NOCHE_FIN)
    : (h >= HORA_NOCHE_INICIO && h < HORA_NOCHE_FIN);
  var base = esNoche ? ATENUACION_NOCHE : 0;
  night.style.opacity = Math.max(0, Math.min(0.9, base + brilloManual));
}
var helpTimer;
function ayuda() {
  help.classList.add('show'); clearTimeout(helpTimer);
  helpTimer = setTimeout(function () { help.classList.remove('show'); }, 3000);
}
// Pantalla completa real (oculta la barra del navegador). Se activa con la primera tecla o clic.
function pantallaCompleta() {
  var el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  try {
    var p = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);
    if (p && p.catch) p.catch(function () {});
  } catch (e) {}
}

document.addEventListener('keydown', function (e) {
  var k = e.keyCode;
  pantallaCompleta();
  if (k === 39) mostrar(1);                       // derecha
  else if (k === 37) mostrar(-1);                 // izquierda
  else if (k === 13) {                            // OK / Enter: fija u oculta la placa
    placaFija = document.body.classList.contains('hidden-plaque');
    clearTimeout(placaTimer);
    document.body.classList.toggle('hidden-plaque', !placaFija);
  }
  else if (k === 38) { brilloManual = Math.max(-0.6, brilloManual - 0.1); aplicarBrillo(); } // más brillo
  else if (k === 40) { brilloManual = Math.min(0.8, brilloManual + 0.1); aplicarBrillo(); }  // menos brillo
  else return;
  e.preventDefault(); ayuda();
});
document.addEventListener('click', function (e) {
  pantallaCompleta();
  mostrar(e.clientX < window.innerWidth / 2 ? -1 : 1); ayuda();
});
window.addEventListener('resize', function () {
  var c = capas[activa];
  if (c.dataset.src) pintarCapa(c, c.dataset.src, +c.dataset.w, +c.dataset.h);
});

function pedirWakeLock() {
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
}
document.addEventListener('visibilitychange', function () { if (!document.hidden) pedirWakeLock(); });

barajar(); mostrar(1); aplicarBrillo(); pedirWakeLock();
setInterval(aplicarBrillo, 60000);
</script>
</body>
</html>
